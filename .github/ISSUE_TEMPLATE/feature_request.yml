name: "Feature request · 기능 제안"
description: "Propose a new feature or an improvement. · 새 기능이나 개선을 제안해 주세요."
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Korean or English is fine. · 한국어·영어 모두 괜찮습니다.

        Before filing, check [docs/features.md](https://github.com/Hyeongcheol-An/HyperEdit/blob/main/docs/features.md) — many ideas are already listed there with a status (implemented / planned / deferred). If yours is listed as planned, a comment on the existing entry or a Discussion is enough. For open-ended ideas, [Discussions](https://github.com/Hyeongcheol-An/HyperEdit/discussions) is the better place.

  - type: textarea
    id: problem
    attributes:
      label: "What problem are you trying to solve? · 어떤 문제를 풀고 싶나요?"
      description: "Describe the situation in your notes file, not the solution yet. · 해결책보다 먼저, 메모 파일에서 겪는 상황을 적어 주세요."
      placeholder: "I keep a tab-separated table in my notes and want to sort it by the second column without leaving the editor."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: "Proposed solution · 제안"
      description: "How should it work? Which ribbon tab, menu or shortcut? How does it behave in column mode or with multi-carets? · 어떻게 동작해야 하나요? 리본 탭·메뉴·단축키, 열 모드·멀티 커서에서의 동작."
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: "Area · 영역"
      multiple: true
      options:
        - "Editing / text tools · 편집·텍스트 도구"
        - "Column mode / multi-caret · 열 모드·멀티 커서"
        - "Find / Replace / Find in Files · 찾기·바꾸기"
        - "Navigation: bookmarks, outline, timeline · 탐색"
        - "Saving / snapshots · 저장·스냅샷"
        - "Themes / fonts · 테마·폰트"
        - "Ribbon / panels / status bar · 리본·패널·상태바"
        - "Localization · 현지화"
        - "Build / release / Homebrew · 빌드·릴리스"
        - "Zed theme export · Zed 테마"
        - "Other · 기타"

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives and prior art · 대안·참고"
      description: "How do other editors do it (UltraEdit, Sublime Text, BBEdit, VS Code, Zed…)? What do you do today as a workaround? · 다른 에디터의 방식, 지금 쓰는 우회 방법."

  - type: dropdown
    id: contribute
    attributes:
      label: "Would you like to implement it? · 직접 구현하시겠어요?"
      options:
        - "Yes, I can open a PR · 네, PR을 올릴 수 있습니다"
        - "Maybe, with some guidance · 안내가 있으면 가능"
        - "No, just proposing · 아니요, 제안만"

  - type: checkboxes
    id: checks
    attributes:
      label: "Checklist · 확인"
      options:
        - label: "I checked docs/features.md and existing issues. · docs/features.md 와 기존 이슈를 확인했습니다."
          required: true
        - label: "This fits a plain-text editor for one big notes file (no cloud sync, no general-purpose IDE features). · 큰 메모 파일 하나를 위한 일반 텍스트 에디터라는 범위에 맞습니다."
          required: true
