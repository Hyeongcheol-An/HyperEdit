name: Release (manual tag)
# 수동으로 민 태그(v0.1.0 등)에 GitHub Release + 서명·공증 DMG 를 만든다. semantic-release 가 만든 릴리스가 이미 있으면 건너뛴다(멱등).
# 평소 릴리스는 release.yml(semantic-release)이 담당하므로 이 워크플로는 베이스라인 태그를 다시 만들 때만 쓴다.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - name: 테마 빌드·검증
        run: python3 themes/build_zed_theme.py && python3 themes/validate.py
      - name: Developer ID 인증서 가져오기 (임시 키체인; 시크릿이 없으면 실패)
        env:
          P12_B64: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          if [ -z "$P12_B64" ]; then echo "::error::DEVELOPER_ID_CERT_P12 시크릿이 없습니다 — 태그 릴리스는 서명본만 만듭니다"; exit 1; fi
          KC="$RUNNER_TEMP/signing.keychain-db"; KCPW="$(uuidgen)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          printf '%s' "$P12_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC" | grep "Developer ID Application" || { echo "::error::p12 에 Developer ID Application 인증서가 없음"; exit 1; }
      - name: XcodeGen + 서명·공증 DMG
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          brew install xcodegen && xcodegen generate
          scripts/make-dmg.sh "${GITHUB_REF_NAME#v}"
      - name: 릴리스 생성 (없을 때만)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then echo "release $tag already exists — skip"; exit 0; fi
          gh release create "$tag" dist/*.dmg dist/SHA256SUMS themes/dist/hyperedit-themes.json#"Zed themes (hyperedit-themes.json)" \
            --title "$tag" --notes "Manual tag release. Install: open the DMG and drag HyperEdit.app to Applications. / 수동 태그 릴리스. DMG 를 열고 HyperEdit.app 을 Applications 로 드래그하세요."
      - name: 정리
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/signing.keychain-db" ]; then security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true; fi
          rm -f "$RUNNER_TEMP/cert.p12" build/AuthKey_*.p8
