name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
defaults:
  run:
    shell: bash   # GitHub 의 명시적 bash 는 `-eo pipefail` — 파이프 뒤의 tail 이 테스트 실패를 삼키지 않는다
jobs:
  themes:
    name: 테마 빌드·검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - name: 팔레트 → Zed 테마 생성
        run: python3 themes/build_zed_theme.py && python3 themes/build_preview.py
      - name: 생성물이 커밋본과 일치하는지
        run: git diff --exit-code -- themes/dist/hyperedit-themes.json docs/theme-preview.html Packages/HyperCore/Sources/HyperCore/Resources/palettes.json || (echo '::error::themes/dist 또는 docs/theme-preview.html 이 palettes.json 과 어긋남. 로컬에서 python3 themes/build_zed_theme.py && python3 themes/build_preview.py 후 커밋' && exit 1)
      - name: 테마 스키마 검증
        run: python3 themes/validate.py
  sensitive:
    name: 개인정보·비밀 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - run: bash scripts/check-sensitive.sh
  commitlint:
    name: 커밋 메시지 검사
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: commitlint (PR 커밋 전부)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: ./node_modules/.bin/commitlint --from "$BASE" --to "$HEAD" --verbose
  detect:
    name: Xcode 프로젝트 존재 확인 (ubuntu, 무료 분 절약)
    runs-on: ubuntu-latest
    outputs:
      has_xcode: ${{ steps.chk.outputs.ok }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - id: chk
        run: |
          if [ -f project.yml ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "project.yml 없음 — macOS 잡 건너뜀"; fi
  xcode:
    name: Xcode 빌드·테스트 (macOS)
    needs: detect
    if: needs.detect.outputs.has_xcode == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - name: HyperCore 단위 테스트
        run: swift test --package-path Packages/HyperCore 2>&1 | tail -30
      - name: XcodeGen
        run: brew install xcodegen && xcodegen generate
      - name: xcodebuild (서명 없이)
        run: |
          xcodebuild -project HyperEdit.xcodeproj -scheme HyperEdit-mac -configuration Debug -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" build 2>&1 | grep -E 'error:|BUILD' | tail -40
